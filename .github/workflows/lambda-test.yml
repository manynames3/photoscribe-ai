name: lambda-test

on:
  pull_request:
    paths:
      - "lambdas/**"
      - ".github/workflows/lambda-test.yml"
  push:
    branches:
      - main
    paths:
      - "lambdas/**"
      - ".github/workflows/lambda-test.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov "moto[s3]"

      - name: Run Lambda tests
        env:
          PYTHONPATH: .
        run: pytest lambdas -v --cov=lambdas --cov-report=term-missing

