name: frontend-build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Init Terraform
        working-directory: terraform
        run: terraform init -input=false -backend-config=dev.backend.hcl

      - name: Capture infrastructure outputs
        id: infra
        working-directory: terraform
        run: |
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "frontend_distribution_id=$(terraform output -raw frontend_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "search_api_url=$(terraform output -raw search_api_url)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          printf 'VITE_API_URL=%s\n' '${{ steps.infra.outputs.search_api_url }}' > .env.production
          npm ci
          npm run build

      - name: Sync assets to S3
        if: steps.infra.outputs.frontend_bucket != ''
        run: aws s3 sync frontend/dist/ "s3://${{ steps.infra.outputs.frontend_bucket }}/" --delete

      - name: Invalidate CloudFront
        if: steps.infra.outputs.frontend_distribution_id != ''
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.infra.outputs.frontend_distribution_id }}" --paths "/*"
